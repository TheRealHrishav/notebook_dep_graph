# pyproject.toml
[project]
name = "notebook-dep-graph"
version = "0.1.0"
description = "Parse Jupyter notebooks, build SQL/DataFrame dependency graphs, and write outputs."
requires-python = ">=3.8"
dependencies = [
    "networkx",
    "pandas",
    "sqlglot"
]

[project.scripts]
build-dep-graph = "cli:main"
